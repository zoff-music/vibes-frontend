name: admin-release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/security.yaml"
      - ".github/workflows/publish-image.yaml"
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.json"
      - "tailwind.vibes.mjs"
      - ".github/workflows/admin-release.yaml"

permissions:
  contents: read

concurrency:
  group: vibes-frontend-admin-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    if: github.repository == 'zoff-music/vibes-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security.yaml

  build:
    needs: [security]
    if: github.repository == 'zoff-music/vibes-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build
        env:
          RELEASE_SHA: ${{ github.sha }}
          ASSET_ORIGIN: ${{ vars.ASSET_ORIGIN }}
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}/admin"
          IMAGE="${IMAGE_REPOSITORY}:${RELEASE_SHA}"
          docker build --no-cache --build-arg ASSET_ORIGIN="$ASSET_ORIGIN" -f apps/admin/Dockerfile -t "$IMAGE" .
          docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      packages: write
    uses: ./.github/workflows/publish-image.yaml
    with:
      app: admin
