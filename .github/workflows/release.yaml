name: release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/security.yaml"
      - ".github/workflows/tests.yaml"
      - "apps/platform/**"
      - "apps/admin/**"
      - "apps/cast/**"
      - "apps/embed/**"
      - "apps/remote/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.json"
      - "tsconfig.tests.json"
      - "vitest.config.mts"
      - "tailwind.vibes.mjs"
      - ".github/workflows/release.yaml"

permissions:
  contents: read

concurrency:
  group: vibes-frontend-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    if: github.repository == 'zoff-music/vibes-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security.yaml

  tests:
    uses: ./.github/workflows/tests.yaml

  changed-apps:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
      any: ${{ steps.changed.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const apps = ['platform', 'admin', 'cast', 'embed', 'remote'];
          const before = process.env.BEFORE_SHA;
          const files = /^0+$/.test(before) ? ['package.json'] : execFileSync('git', ['diff', '--name-only', before, process.env.RELEASE_SHA], { encoding: 'utf8' }).trim().split('\n');
          const shared = files.some(file => /^(packages\/|\.github\/workflows\/|package\.json$|pnpm-|biome\.json$|tsconfig|vitest\.config|tailwind\.)/.test(file));
          const changed = apps.filter(app => shared || files.some(file => file.startsWith(`apps/${app}/`)));
          appendFileSync(process.env.GITHUB_OUTPUT, `apps=${JSON.stringify(changed)}\nany=${changed.length > 0}\n`);
          JS

  build:
    needs: [security, tests, changed-apps]
    if: github.repository == 'zoff-music/vibes-frontend' && needs.changed-apps.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changed-apps.outputs.apps) }}
    permissions:
      contents: read
      packages: write
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Image tags
        id: image
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_APP: ${{ matrix.app }}
        run: |
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/${RELEASE_APP}"
          image_version="main-$(date -u +%Y%m%d%H%M%S)-${RELEASE_SHA}"
          echo "sha=${image_repository}:${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${image_repository}:${image_version}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          pull: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          provenance: false
          build-args: |
            ASSET_ORIGIN=${{ vars.ASSET_ORIGIN }}
          tags: |
            ${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.version }}
