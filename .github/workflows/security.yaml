name: security

on:
  pull_request:
  workflow_call:

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  semgrep:
    if: github.repository == 'zoff-music/vibes-frontend' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.180.0
      - name: Scan source
        run: semgrep scan --config auto --error --strict --exclude='*.yaml' --exclude='Dockerfile' apps/ packages/ scripts/
