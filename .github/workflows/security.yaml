name: security

on:
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'zoff-music/vibes-frontend' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26.8.1"
      - uses: pnpm/action-setup@v4
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

  semgrep:
    if: github.repository == 'zoff-music/vibes-frontend' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.180.0
      - name: Scan source
        run: semgrep scan --config auto --error --strict --exclude='*.yaml' --exclude='Dockerfile' apps/ packages/ scripts/
