name: security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'zoff-music/vibes-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26.8.1"
      - name: Install pnpm
        run: npm install --global pnpm@12.3.4
      - name: Verify locked security patches
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        # These exact advisories are fixed by committed pnpm patches; see patches/README.md.
        # Remove each exception with its patch when a fixed upstream version is available.
        run: >-
          pnpm audit --audit-level=moderate
          --ignore GHSA-86w9-cpqp-85rv
          --ignore GHSA-vfj7-8cjw-p6xm
          --ignore GHSA-hp3w-g68c-fv3c

  semgrep:
    if: github.repository == 'zoff-music/vibes-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.180.0
      - name: Scan source
        run: semgrep scan --config auto --error --strict --exclude='*.yaml' --exclude='Dockerfile' apps/ packages/ scripts/
