name: embed-release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/security.yaml"
      - ".github/workflows/players.yaml"
      - "scripts/players/**"
      - "apps/embed/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.json"
      - "tailwind.vibes.mjs"
      - ".github/workflows/embed-release.yaml"

permissions:
  contents: read

concurrency:
  group: vibes-frontend-embed-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    if: github.repository == 'zoff-music/vibes-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security.yaml

  players:
    uses: ./.github/workflows/players.yaml

  build:
    needs: [security, players]
    if: github.repository == 'zoff-music/vibes-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Image tags
        id: image
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/embed"
          image_version="main-$(date -u +%Y%m%d%H%M%S)-${RELEASE_SHA}"
          echo "sha=${image_repository}:${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${image_repository}:${image_version}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/embed/Dockerfile
          push: true
          no-cache: true
          provenance: false
          build-args: |
            ASSET_ORIGIN=${{ vars.ASSET_ORIGIN }}
          tags: |
            ${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.version }}
