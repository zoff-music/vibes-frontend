name: player integration

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tracks:
        description: 'Optional official-widget tracks JSON: SoundCloud, SoundCloud, YouTube, YouTube'
        type: string
        required: false
  workflow_call:

permissions:
  contents: read

jobs:
  players:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYER_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck player tests
        run: pnpm typecheck:players
      - name: Check player test conventions
        run: pnpm exec biome check scripts/players
      - name: Install browsers
        run: pnpm exec playwright install --with-deps "${{ matrix.browser }}"
      - name: Player integration
        run: pnpm test:players
      - name: Optional official-widget integration
        if: github.event_name == 'workflow_dispatch' && inputs.tracks != '' && matrix.browser == 'chromium'
        env:
          PLAYER_TRACKS: ${{ inputs.tracks }}
        run: pnpm test:players:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: player-failure-screenshots-${{ matrix.browser }}
          path: test-results/players
