name: cast-release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/security.yaml"
      - "apps/cast/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.json"
      - ".github/workflows/cast-release.yaml"

permissions:
  contents: read

concurrency:
  group: vibes-frontend-cast-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    if: github.repository == 'zoff-music/vibes-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security.yaml

  build:
    needs: security
    if: github.repository == 'zoff-music/vibes-frontend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Build
        env:
          RELEASE_SHA: ${{ github.sha }}
          ASSET_ORIGIN: ${{ vars.ASSET_ORIGIN }}
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}/cast"
          IMAGE_VERSION="main-$(date -u +%Y%m%d%H%M%S)-${RELEASE_SHA}"
          IMAGE="${IMAGE_REPOSITORY}:${RELEASE_SHA}"
          VERSIONED_IMAGE="${IMAGE_REPOSITORY}:${IMAGE_VERSION}"
          docker build --no-cache --build-arg ASSET_ORIGIN="$ASSET_ORIGIN" -f apps/cast/Dockerfile -t "$IMAGE" -t "$VERSIONED_IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSIONED_IMAGE=$VERSIONED_IMAGE" >> "$GITHUB_ENV"
      - name: Prepare Docker credentials
        run: |
          docker_config=$(mktemp -d "$RUNNER_TEMP/zoff-docker.XXXXXX")
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker push "$VERSIONED_IMAGE"
      - name: Remove Docker credentials
        if: always() && env.DOCKER_CONFIG != ''
        run: |
          case "$DOCKER_CONFIG" in
            "$RUNNER_TEMP"/zoff-docker.*) ;;
            *) exit 1 ;;
          esac

          docker logout ghcr.io || true
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG"
