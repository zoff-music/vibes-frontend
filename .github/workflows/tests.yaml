name: tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tracks:
        description: 'Optional official-widget tracks JSON: SoundCloud, SoundCloud, YouTube, YouTube'
        type: string
        required: false
  workflow_call:

permissions:
  contents: read

jobs:
  browser-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Resolve matching Playwright image
        id: playwright
        shell: bash
        run: |
          version=$(node -p "require('./package.json').devDependencies.playwright")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Pin Playwright to an exact release version for the browser image."
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  tests:
    needs: browser-image
    runs-on: ubuntu-24.04
    # Browsers and their OS dependencies are baked into the matching image.
    container:
      image: ${{ needs.browser-image.outputs.image }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        env:
          PLAYER_TRACKS: ${{ inputs.tracks || '' }}
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-artifacts
          path: |
            test-results/
            packages/ui/.vitest/
